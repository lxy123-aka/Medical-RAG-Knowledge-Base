# =============================================================================
# 医典 RAG 多维知识库系统 - Docker Compose 编排
# =============================================================================
# 包含: Neo4j, Milvus+etcd+MinIO, PostgreSQL
# Shell 要求: 兼容 Windows PowerShell
# =============================================================================

version: '3.8'

services:
  # ── Neo4j 知识图谱 ─────────────────────────────────────────
  neo4j:
    image: neo4j:5.15-community
    container_name: medical-rag-neo4j
    restart: unless-stopped
    ports:
      - "7475:7474"   # Browser
      - "7688:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/medical-rag-2024
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - medical-rag-network

  # ── etcd (Milvus 依赖) ────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: medical-rag-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      --advertise-client-urls=http://0.0.0.0:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
      --initial-cluster-token=etcd-01
      --initial-advertise-peer-urls=http://0.0.0.0:2380
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-cluster=default=http://0.0.0.0:2380
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - medical-rag-network

  # ── MinIO (Milvus 依赖) ───────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: medical-rag-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"   # Console
      - "9000:9000"   # API
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      # minio 官方镜像不自带 curl，改用内置 mc 客户端做就绪检查
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - medical-rag-network

  # ── Milvus 向量数据库 ─────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: medical-rag-milvus
    restart: unless-stopped
    ports:
      - "19531:19530"  # gRPC（19530 被云诊项目占用，改用 19531）
      - "19091:9091"    # Health
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - medical-rag-network

  # ── PostgreSQL 关系数据库 ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medical-rag-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: medical-rag-2024
      POSTGRES_DB: medical_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medical-rag-network

  # ── Redis (可选，用于缓存) - 端口改为 6380 避免冲突 ────────
  redis:
    image: redis:7-alpine
    container_name: medical-rag-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medical-rag-network

volumes:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
  redis_data:

networks:
  medical-rag-network:
    driver: bridge
